<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lead Studio</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 22 22'%3E%3Crect width='22' height='22' rx='4' fill='%232a2038'/%3E%3Crect x='3' y='4' width='16' height='3.4' rx='1' fill='%23e9a51c'/%3E%3Crect x='5.5' y='9.3' width='11' height='3.4' rx='1' fill='%23e9a51c' opacity='.78'/%3E%3Crect x='8' y='14.6' width='6' height='3.4' rx='1' fill='%23e9a51c' opacity='.55'/%3E%3C/svg%3E">
<style>
:root{
  --side:#fafafa;--side-line:#ececf1;--side-ink:#2b2b33;--side-mute:#7a7a88;--side-hi:#f0f0f4;--side-on:#eceaff;
  --bg:#ffffff;--panel:#ffffff;--ink:#1c1c22;--mute:#71717f;--line:#e8e8ee;--soft:#f6f6f9;--stripe:#fcfcfd;
  --accent:#4f46e5;--accent-ink:#ffffff;--accent-soft:#eceaff;--link:#4f46e5;--sel:#f3f2ff;
  --hot:#d1372b;--warm:#b06000;--ok:#15935f;
  --ui:"Inter","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"Cascadia Mono",Consolas,ui-monospace,monospace;
  --r:8px;
}
@media (prefers-color-scheme:dark){:root{
  --side:#121216;--side-line:#232329;--side-ink:#e9e9f0;--side-mute:#8b8b9a;--side-hi:#1d1d23;--side-on:#262152;
  --bg:#0f0f13;--panel:#15151a;--ink:#e9e9f0;--mute:#9a9aa8;--line:#26262e;--soft:#1a1a20;--stripe:#17171d;
  --accent:#6d63ff;--accent-ink:#fff;--accent-soft:#241f4d;--link:#a79cff;--sel:#1e1b3a;
  --hot:#ff8d82;--warm:#eeb15f;--ok:#4fd49b;
}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:13.5px/1.45 var(--ui);color:var(--ink);background:var(--bg);
  display:grid;grid-template-columns:232px minmax(0,1fr);grid-template-rows:minmax(0,1fr);
  -webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
a{color:var(--link)}

/* ---------- sidebar ---------- */
.side{background:var(--side);color:var(--side-ink);border-right:1px solid var(--side-line);
  display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:9px;padding:13px 14px 11px}
.brand .mark{width:26px;height:26px;border-radius:7px;background:var(--accent);display:grid;place-items:center;flex:none}
.brand .bname{font-size:15px;font-weight:650;letter-spacing:-.1px}
.brand .ver{color:var(--side-mute);font-size:11px;margin-left:auto}
.srch{padding:0 12px 10px}
.srch label{display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--side-line);
  border-radius:7px;padding:5px 8px;color:var(--side-mute)}
.srch input{all:unset;flex:1;min-width:0;font-size:12.5px;color:var(--side-ink)}
.srch kbd{font:10.5px var(--ui);border:1px solid var(--side-line);border-radius:4px;padding:0 4px;color:var(--side-mute)}
.nav{flex:1;min-height:0;overflow:auto;padding:2px 8px 10px;display:flex;flex-direction:column;gap:1px}
.nav button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:9px;width:100%;
  padding:6px 9px;border-radius:7px;cursor:pointer;color:var(--side-ink);font-size:13px}
.nav button:hover{background:var(--side-hi)}
.nav button.on{background:var(--side-on);color:var(--accent);font-weight:600}
.nav button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.nav button svg{flex:none;opacity:.72}
.nav button.on svg{opacity:1}
.nav .sec{color:var(--side-mute);font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:13px 9px 4px}
.nav .n{margin-left:auto;font-size:11px;color:var(--side-mute);font-variant-numeric:tabular-nums}
.nav button.on .n{color:inherit}
.nav .grow{flex:1;min-height:6px}
.nav .rule{height:1px;background:var(--side-line);margin:8px 9px}
.wscard{display:flex;align-items:center;gap:9px;padding:10px 12px;border-top:1px solid var(--side-line);min-width:0}
.wscard .av{width:28px;height:28px;border-radius:7px;background:var(--accent);color:#fff;display:grid;place-items:center;
  font-size:12px;font-weight:650;flex:none}
.wscard .t{min-width:0}
.wscard .t b{display:block;font-size:12.5px;font-weight:600}
.wscard .t span{display:block;font-size:11px;color:var(--side-mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- main column ---------- */
.col{min-width:0;min-height:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:6px;height:42px;padding:0 14px;border-bottom:1px solid var(--line);
  background:var(--panel);flex:none}
.crumbs{display:flex;align-items:center;gap:4px;min-width:0}
.crumbs .c{display:flex;align-items:center;gap:6px;padding:4px 9px;border-radius:7px;color:var(--mute);font-size:12.5px;
  white-space:nowrap}
.crumbs .c.on{background:var(--soft);color:var(--ink);font-weight:600}
.crumbs .sepr{color:var(--line)}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--mute);font-size:11.5px;min-width:0}
.topbar .right .p{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:36vw;font:11px var(--mono)}
main{min-width:0;min-height:0;display:flex;flex-direction:column;flex:1}

/* ---------- toolbar (.bar) ---------- */
.bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:7px 12px;background:var(--panel);
  border-bottom:1px solid var(--line)}
.bar h1{font-size:13.5px;font-weight:650;margin:0 8px 0 2px;white-space:nowrap}
.bar .sp{flex:1}
.bar .note{color:var(--mute);font-size:12px}
.body{flex:1;min-height:0;overflow:auto;padding:16px}
.body.flush{padding:0;display:flex;flex-direction:column}
.lead{color:var(--mute);margin:0 0 12px;max-width:78ch}

.btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:4px 10px;cursor:pointer;
  white-space:nowrap;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;line-height:1.7}
.btn:hover{background:var(--soft)}
.btn.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.go:hover{filter:brightness(1.08)}
.btn.stop{background:var(--hot);border-color:var(--hot);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
input[type=text],input[type=password],input[type=number],select,textarea{border:1px solid var(--line);background:var(--panel);
  border-radius:7px;padding:4px 8px;min-width:0;font-size:12.5px}
textarea{width:100%;min-height:92px;resize:vertical;line-height:1.45;font-size:13px}
.tag{display:inline-flex;align-items:center;font-size:11.5px;padding:2px 8px;border-radius:7px;background:var(--soft);
  border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.tag.run{color:var(--accent);background:var(--accent-soft);border-color:transparent;font-weight:600}
.tag.bad{color:var(--hot);border-color:currentColor;background:transparent}
.tag.ok{color:var(--ok);border-color:currentColor;background:transparent}

/* ---------- data grid ---------- */
.gridwrap{flex:1;min-height:0;overflow:auto;background:var(--panel)}
table.grid{border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:100%}
.grid th{position:sticky;top:0;z-index:1;background:var(--soft);text-align:left;font-weight:600;padding:0 10px;height:32px;
  border-bottom:1px solid var(--line);border-right:1px solid var(--line);white-space:nowrap;color:var(--ink)}
.grid th .h{display:flex;align-items:center;gap:7px}
.grid th i{font-style:normal;font-size:10px;font-weight:700;color:var(--mute);width:14px;height:14px;border-radius:4px;
  background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.grid th b{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.grid th u{margin-left:auto;color:var(--mute);text-decoration:none;font-size:9px;opacity:.7}
.grid tr.fill td{position:sticky;top:32px;z-index:1;background:var(--panel);color:var(--mute);font-size:11px;height:22px;
  padding:0 10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.grid tr.fill td.rn{z-index:2}
.grid td{padding:0 10px;height:30px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);max-width:340px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.grid tbody tr:hover td{background:var(--sel)}
.grid .rn{color:var(--mute);text-align:right;font-variant-numeric:tabular-nums;position:sticky;left:0;background:var(--panel);
  min-width:44px;border-right:1px solid var(--line)}
.grid th.rn{background:var(--soft);z-index:2}
.grid tbody tr:hover .rn{background:var(--sel)}
.grid td.wrap{white-space:normal;min-width:280px;max-width:460px;padding:6px 10px;height:auto;line-height:1.4}
.HOT{color:var(--hot);font-weight:700}.WARM{color:var(--warm);font-weight:700}
.empty{padding:44px 18px;color:var(--mute);max-width:70ch}
.empty b{color:var(--ink);display:block;font-size:15px;margin-bottom:4px;font-weight:650}

/* ---------- status strip ---------- */
.status{flex:none;background:var(--panel);border-top:1px solid var(--line);display:flex;align-items:center;
  font-size:11.5px;color:var(--mute);height:28px;padding:0 6px;overflow:hidden}
.status span,.status button{padding:0 10px;height:100%;display:flex;align-items:center;gap:6px;white-space:nowrap}
.status button{all:unset;box-sizing:border-box;cursor:pointer;padding:0 10px;height:100%;display:flex;align-items:center;
  gap:6px;color:var(--mute);border-radius:6px}
.status button:hover{background:var(--soft);color:var(--ink)}
.status .path{margin-left:auto;overflow:hidden;text-overflow:ellipsis}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line);flex:none}
.dot.ok{background:var(--ok)}.dot.run{background:var(--accent)}.dot.bad{background:var(--hot)}

/* ---------- tool list ---------- */
.tools{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tool{display:grid;grid-template-columns:minmax(0,1fr) minmax(150px,280px) auto;gap:14px;align-items:center;
  padding:12px 14px;border-bottom:1px solid var(--line)}
.tool:last-child{border-bottom:0}
.tool:hover{background:var(--stripe)}
.tool h3{margin:0 0 2px;font-size:13.5px;font-weight:650;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tool p{margin:0;color:var(--mute);font-size:12.5px}
.tool .file{font:11.5px var(--mono);color:var(--mute);margin-top:3px;word-break:break-all}
.tool input{width:100%;font:12px var(--mono)}
.tool .acts{display:flex;gap:6px}
@media (max-width:900px){.tool{grid-template-columns:1fr}}

/* ---------- forms ---------- */
.form{display:grid;grid-template-columns:170px minmax(0,640px);gap:10px 16px;align-items:start;max-width:860px}
.form label{padding-top:6px;color:var(--mute)}
.form .full{grid-column:1/3}
.form small{display:block;color:var(--mute);margin-top:4px}
.checks{display:flex;flex-wrap:wrap;gap:4px 6px}
.checks label{padding:3px 10px;border:1px solid var(--line);border-radius:14px;cursor:pointer;color:var(--ink);
  background:var(--panel);font-size:12.5px}
.checks input{position:absolute;opacity:0;pointer-events:none}
.checks label:has(input:checked){background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:600}
.checks label:has(input:focus-visible){outline:2px solid var(--accent)}
section.box{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:14px;
  max-width:900px}
section.box h2{font-size:14.5px;margin:0 0 4px;font-weight:650}
section.box p{margin:0 0 12px;color:var(--mute);max-width:74ch}
pre.code{background:var(--soft);border:1px solid var(--line);border-radius:7px;padding:10px 12px;font:12px/1.5 var(--mono);
  overflow:auto;margin:0 0 8px;white-space:pre-wrap;word-break:break-all}
pre.log{flex:1;min-height:0;margin:0;background:#101014;color:#d8d8e4;padding:12px 16px;font:12px/1.5 var(--mono);
  overflow:auto;white-space:pre-wrap;word-break:break-word}
.jobs td{white-space:nowrap}.jobs tbody tr{cursor:pointer}
.crumb{display:flex;gap:2px;align-items:center;flex-wrap:wrap}
.crumb button{all:unset;cursor:pointer;color:var(--mute);padding:3px 7px;border-radius:6px;font-size:12.5px}
.crumb button:hover{background:var(--soft);color:var(--ink)}
.crumb span{color:var(--line)}

/* ---------- filter chips ---------- */
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);
  align-items:center}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:3px 10px;cursor:pointer;display:flex;
  align-items:center;gap:6px;white-space:nowrap;font-size:12.5px}
.chip:hover{background:var(--soft)}
.chip.set{border-color:transparent;color:var(--accent);background:var(--accent-soft);font-weight:600}
.chip.open{box-shadow:0 0 0 2px var(--accent-soft);border-color:var(--accent)}
.chip .k{font-size:10.5px;background:var(--accent);color:#fff;border-radius:6px;padding:0 5px;font-weight:600}
.panel{background:var(--soft);border-bottom:1px solid var(--line);padding:12px 14px 14px}
.panel h3{margin:0 0 8px;font-size:12.5px;font-weight:650}
.panel .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:9px}
.panel input[type=text]{flex:1;min-width:180px}
.sugg{display:flex;flex-wrap:wrap;gap:5px;max-height:148px;overflow:auto}
.sugg button{all:unset;cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:2px 9px;
  font-size:12.5px}
.sugg button:hover{border-color:var(--accent)}
.sugg button.on{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:600}
.sugg button .c{color:var(--mute);font-size:11px;margin-left:5px;font-variant-numeric:tabular-nums}
.sugg button.on .c{color:inherit}
.toks{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px}
.tok{border:1px solid transparent;color:var(--accent);background:var(--accent-soft);border-radius:7px;padding:2px 6px 2px 9px;
  font-size:12.5px;display:flex;gap:6px;align-items:center}
.tok button{all:unset;cursor:pointer;font-weight:700;padding:0 2px;line-height:1}
.tabs{display:flex;gap:2px}
.tabs button{all:unset;cursor:pointer;padding:5px 11px;border-radius:7px;color:var(--mute);font-size:12.5px}
.tabs button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.sum{display:flex;gap:22px;flex-wrap:wrap;padding:12px 14px;background:var(--soft);border-bottom:1px solid var(--line)}
.sum div{min-width:96px}
.sum b{display:block;font-size:20px;font-weight:650;line-height:1.2;font-variant-numeric:tabular-nums}
.sum span{color:var(--mute);font-size:11.5px}
.toast{position:fixed;right:16px;bottom:38px;background:#1c1c22;color:#fff;padding:9px 14px;border-radius:8px;max-width:420px;
  box-shadow:0 8px 28px rgba(0,0,0,.22);z-index:9;font-size:12.5px}
.toast.bad{background:var(--hot)}
@media (max-width:760px){
  body{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .side{flex-direction:row;flex-wrap:wrap;align-items:center;border-right:0;border-bottom:1px solid var(--side-line)}
  .srch,.wscard,.nav .sec,.nav .grow,.nav .rule{display:none}
  .nav{flex-direction:row;flex-wrap:wrap;overflow:visible}
  .nav button{width:auto}
  .form{grid-template-columns:1fr}.form .full{grid-column:1}
}
</style>
</head>
<body>
<aside class="side" aria-label="Sections">
  <div class="brand">
    <span class="mark"><svg width="15" height="15" viewBox="0 0 22 22" aria-hidden="true"><rect x="1" y="3" width="20" height="4" rx="1.4" fill="#fff"/><rect x="4" y="9" width="14" height="4" rx="1.4" fill="#fff" opacity=".75"/><rect x="7.5" y="15" width="7" height="4" rx="1.4" fill="#fff" opacity=".5"/></svg></span>
    <span class="bname">Lead Studio</span><span class="ver" id="ver"></span>
  </div>
  <div class="srch"><label><svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10.6 10.6L14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    <input id="jumpq" type="text" placeholder="Search or jump to..." aria-label="Search or jump to"><kbd>Ctrl K</kbd></label></div>
  <nav class="nav" id="side"></nav>
  <div class="wscard"><span class="av" id="wsav">LS</span><span class="t"><b id="wsname">Workspace</b><span id="ws"></span></span></div>
</aside>
<div class="col">
  <header class="topbar" id="topbar"></header>
  <main id="main"></main>
  <footer class="status" id="status"></footer>
</div>
<script>
const T="__TOKEN__";
let S={tools:[],jobs:[],hot:[],settings:{}},view=decodeURIComponent(location.hash.slice(1))||"today",curJob=null,timer=null,models=null;
let L={path:"",file:null,q:"",offset:0};          // Leads page
let E={input:"",cols:[],picked:[]};               // AI enrich page
let C={f:{},open:null,cols:[],rows:[],offset:0,total:null,ms:0,busy:false,home:null,ran:false};   // Contacts search
let O={tab:"manyreach",res:null};
let B={};                                         // the mailbox being edited on Connections
let MB=null;                                      // the mailboxes, fetched when a page needs them
let MBN=25;                                       // how many of them Connections shows at once
async function boxes(force){if(MB&&!force)return MB;const r=await get("/api/mailboxes");MB=r.mailboxes||[];return MB}                  // Outreach page
let JT="leads";                                   // which tab of a job: leads or log
const PAGE=200,CPAGE=50;
const FDEF=[["country","Country","countries",1],["titles","Job titles","",0],["keywords","Keywords","",0],
  ["industries","Industries","industries",0],["sizes","Company size","sizes",1],["location","Location","",0],
  ["technologies","Technologies","technologies",0],["sources","Source","sources",1],["must","Must have","",2]];
const MUST=[["named_person","A named person, not info@"],["business_email","Company email, not Gmail"],["name","Has a name"],
  ["title","Has a job title"],["phone","Has a phone number"],["website","Has a website"],["company","Has a company name"],
  ["industry","Has an industry"],["technology","Has known technology"]];
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const get=(p,q={})=>fetch(p+"?"+new URLSearchParams({...q,t:T})).then(r=>r.json());
const post=(p,b={})=>fetch(p,{method:"POST",body:JSON.stringify({...b,t:T})}).then(r=>r.json());
const gname=g=>g.replace(/^\d+\.\s*/,"");
function toast(msg,bad){const d=document.createElement("div");d.className="toast"+(bad?" bad":"");d.setAttribute("role","status");d.textContent=msg;document.body.append(d);setTimeout(()=>d.remove(),bad?7000:3200)}
const PRESETS=[
 ["What they sell","what_they_sell","In at most 8 words, say what this company sells and to whom."],
 ["Industry","industry_ai","Name this company's industry in 1 to 3 words, for example: roofing contractor, dental clinic, Shopify apparel store."],
 ["Fit for HYROS","fit_hyros","Score 0 to 3 how well this company fits ad-attribution software for businesses that spend on Meta or Google ads (3 = clearly sells online and runs paid ads, 0 = no fit). Reply as: score - reason in at most 8 words."],
 ["Fit for QuoteIQ","fit_quoteiq","Score 0 to 3 how well this company fits quoting and scheduling software for home-service contractors (3 = a contractor that quotes jobs on site, 0 = no fit). Reply as: score - reason in at most 8 words."],
 ["Opening line","opening_line","Write one plain, specific opening sentence for a first email to this company that refers to something in the record. No flattery, no exclamation marks, at most 20 words."],
 ["Website language","site_language","Which language is this company's website written in? Reply with the language name only."]];

/* ---------- chrome ---------- */
async function refresh(){
  try{S=await get("/api/state")}catch(e){return}
  $("#ver").textContent=S.version;$("#ws").textContent=S.root;
  const wn=(S.root||"Workspace").replace(/[\\/]+$/,"").split(/[\\/]/).pop()||"Workspace";
  $("#wsname").textContent=wn;$("#wsav").textContent=wn.slice(0,2).toUpperCase();chrome();
  const typing=["INPUT","TEXTAREA","SELECT"].includes(document.activeElement?.tagName);
  if(!typing&&(view==="jobs"||view.startsWith("g:")))render();
}
const IC={

document.addEventListener("DOMContentLoaded",()=>{
  const q=$("#jumpq");if(!q)return;

const CT=c=>{c=String(c).toLowerCase();

function grid(cols,rows,start=0,heat=-1,wrap=[]){
  const fill=cols.map((c,k)=>rows.length?Math.round(100*rows.filter(r=>String(r[k]??"").trim()!=="").length/rows.length):0);
  return `<table class="grid"><thead><tr><th class="rn">#</th>`
   +cols.map(c=>`<th><span class="h"><i>${CT(c)}</i><b>${esc(c)}</b><u>&#9662;</u></span></th>`).join("")
   +`</tr></thead><tbody><tr class="fill"><td class="rn"></td>`
   +fill.map(p=>`<td>${p}%</td>`).join("")+`</tr>`
   +rows.map((r,i)=>`<tr><td class="rn">${start+i+1}</td>${cols.map((c,k)=>`<td class="${k===heat?esc(r[k]):""}${wrap.includes(k)?" wrap":""}" title="${esc(r[k])}">${esc(r[k])}</td>`).join("")}</tr>`).join("")
   +`</tbody></table>`;
}

async function log(id){

    const stick=p.scrollTop+p.clientHeight>=p.scrollHeight-40;p.textContent=r.log;if(stick)p.scrollTop=p.scrollHeight;
    if(!r.job){$("#ls").textContent="from an earlier session";$("#stop").disabled=true;return clearInterval(timer)}
    $("#lt").textContent=r.job.name;$("#ls").textContent=r.job.running?"running, "+r.job.minutes+" min":(r.job.code?"stopped or failed":"finished")+" after "+r.job.minutes+" min";

}

let G={sum:null,cols:[],rows:[],q:"",offset:0,tld:"",busy:""};
async function gaps(){
  const m=$("#main"),f=G.sum||{};
  const tile=(n,l)=>`<div><b>${n===null||n===undefined?"-":nfmt(n)}</b><span>${l}</span></div>`;
  m.innerHTML=`<div class="bar"><h1>Domains without contacts</h1>
     <span class="note">Everyone in your lead database with no email and no phone - and what Common Crawl still holds about them</span>
     <span class="sp"></span>
     <input type="text" id="gq" placeholder="Search" value="${esc(G.q)}" style="width:170px">
     <input type="text" id="gt" placeholder="only .sk,.cz" value="${esc(G.tld)}" style="width:120px">
     <button class="btn" id="gr">${G.sum?"Rebuild the list":"Build the list"}</button>
     <button class="btn go" id="ge" ${G.sum&&G.sum.findable_in_common_crawl?"":"disabled"}>Enrich from Common Crawl</button>
     <button class="btn" id="gx">Export what was found</button></div>
   ${G.sum?`<div class="sum">${tile(f.domains_in_database,"domains in the database")}
     ${tile(f.without_any_contact,"with nobody to write to")}
     ${tile(f.findable_in_common_crawl,"Common Crawl has a page for")}
     ${tile(f.domains_fetched,"already looked up")}
     ${tile(f.contacts_found,"contacts found")}
     <div><b>${esc(f.hit_rate||"-")}</b><span>of looked-up domains gave an address</span></div></div>`:""}
   <div class="body flush" id="gbody">${G.busy?`<div class="empty"><b>${esc(G.busy)}</b>This reads your whole lead database, so it can take a minute.</div>`:""}</div>`;
  $("#gr").onclick=gapsBuild;
  $("#ge").onclick=gapsEnrich;
  $("#gx").onclick=async()=>{const r=await post("/api/cc/export",{});
    if(r.error)return toast(r.error,true);
    toast(nfmt(r.domains_with_a_contact)+" domains with a contact -> "+r.file);await gapsLoad()};
  $("#gq").oninput=deb(()=>{G.q=$("#gq").value;G.offset=0;gapsLoad()},350);
  $("#gt").oninput=deb(()=>{G.tld=$("#gt").value},350);
  if(!G.busy)await gapsLoad();
}
async function gapsBuild(){
  G.busy="Going through the lead database";gaps();
  const r=await post("/api/cc/gaps",{tld:G.tld});
  G.busy="";
  if(r.error){toast(r.error,true);return gaps()}
  const st=await post("/api/cc/status",{});
  G.sum={...r,...(st.error?{}:st)};
  toast(nfmt(r.without_any_contact)+" domains have nobody to write to"
    +(r.findable_in_common_crawl?"; Common Crawl has a page for "+nfmt(r.findable_in_common_crawl):""));
  G.offset=0;gaps();
}
async function gapsEnrich(){
  const n=G.sum?.findable_in_common_crawl||0;
  if(!confirm("Look up "+nfmt(n)+" domains in Common Crawl?\n\nIt downloads the stored copy of each site's home and "
    +"contact page - a few kilobytes each - and reads the addresses off them. The websites themselves are never contacted.\n\n"
    +"You can stop it any time; what is already found is kept."))return;
  const r=await post("/api/cc/run",{source:"hf",par:40});
  if(r.error)return toast(r.error,true);
  curJob=r.job;JT="log";await refresh();go("log");
}
async function gapsLoad(){
  const d=await get("/api/table",{path:"CC_ENRICH/gaps.csv",q:G.q,offset:G.offset,limit:PAGE});
  const b=$("#gbody");if(!b)return;
  if(d.error||!d.cols?.length){
    b.innerHTML=`<div class="empty"><b>No list yet</b>Press "Build the list" and I will go through your lead database,
      keep every domain where no row has an email or a phone, and check how many of them Common Crawl still has a page for.</div>`;
    return;
  }
  G.cols=d.cols;G.rows=d.rows;
  const hv=d.cols.indexOf("cc_contact_pages");
  b.innerHTML=`<div class="gridwrap">${grid(d.cols,d.rows,G.offset)}</div>
    <div class="bar"><span class="note">${nfmt(G.offset+1)}-${nfmt(G.offset+d.rows.length)} of ${nfmt(d.total)}${d.counted?"":"+"}</span>
     <span class="sp"></span>
     <button class="btn" id="gp" ${G.offset?"":"disabled"}>Previous</button>
     <button class="btn" id="gn" ${d.more?"":"disabled"}>Next</button></div>`;
  if($("#gp"))$("#gp").onclick=()=>{G.offset=Math.max(0,G.offset-PAGE);gapsLoad()};
  if($("#gn"))$("#gn").onclick=()=>{G.offset+=PAGE;gapsLoad()};
}

let W={tab:"links",sum:null,file:"",par:20,pages:5,delay:1,robots:true,limit:0,out:null};
async function web(){
  const m=$("#main"),f=W.sum||{};

   ${W.sum?`<div class="sum">${tile(f.sites_scanned_for_links,"sites scanned for links")}
     ${tile(f.contact_pages_found,"contact pages found")}
     ${tile(f.sites_crawled_for_emails,"sites crawled for emails")}
     ${tile(f.addresses_found,"addresses found")}
     ${tile(f.hit_rate,"of crawled sites gave an address")}</div>`:""}
   <div class="body"><section class="box">
   ${W.tab==="links"
     ? `<h2>Find each site's contact pages</h2>
        <p>One request per site: it reads the homepage, pulls out every link, and works out which lead to
        <b>contact</b>, <b>about</b>, <b>team</b>, <b>legal/impressum</b>, <b>careers</b> or <b>support</b> pages -
        in Slovak, Czech, German, Polish, Hungarian and English. Subdomains on the same company domain are listed too.
        You get one row per site with the best contact page, and a full link table beside it.</p>`
     : `<h2>Crawl sites for addresses</h2>
        <p>Homepage first, then it follows the most promising internal pages - kontakt, impressum, o-nás, team -
        up to the limit you set, and reads addresses and phone numbers off all of them.
        It decodes <code>name [at] firma [dot] sk</code> and Cloudflare-hidden addresses, and ranks what it finds:
        the company's own role address first, <code>noreply@</code> last.</p>`}
   <div class="form">
    <label for="wf">Domains file</label><div><input type="text" id="wf" value="${esc(W.file)}" placeholder="CC_ENRICH/gaps.csv" style="width:100%">
      <small>A CSV with a domain, website or url column, or a plain list, one per line. Anywhere in the workspace.
      <a href="#" id="wg">use the no-contact list</a></small></div>
    <label for="wp">At a time</label><div><input type="number" id="wp" value="${W.par}" min="1" max="100" style="width:90px">
      <small>Parallel sites. 20 is polite, 50 is pushing it - these are other people's servers.</small></div>
    ${W.tab==="emails"?`<label for="wpg">Pages per site</label><div><input type="number" id="wpg" value="${W.pages}" min="0" max="25" style="width:90px">

    <label for="wd">Pause</label><div><input type="number" id="wd" value="${W.delay}" min="0" max="30" step="0.5" style="width:90px">
      <small>Seconds between two requests to the <i>same</i> site. Different sites are hit in parallel regardless.</small></div>
    <label for="wl">How many sites</label><div><input type="number" id="wl" value="${W.limit}" min="0" style="width:110px"><small>0 means the whole file. Already-done domains are skipped either way.</small></div>
    <label for="wr">robots.txt</label><div><div class="checks"><label><input type="checkbox" id="wr" ${W.robots?"checked":""}>Respect it</label></div>

    <div class="full" style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn go" id="wrun">${W.tab==="links"?"Find the contact pages":"Start crawling"}</button>
      <button class="btn" id="wst">Refresh the numbers</button>
      <button class="btn" id="wex">Export the addresses</button></div>
   </div>
   ${W.out?`<pre class="code" style="margin-top:12px">${esc(JSON.stringify(W.out,null,1))}</pre>`:""}
   </section></div>`;
  $$("[data-wt]").forEach(b=>b.onclick=()=>{W.tab=b.dataset.wt;W.out=null;web()});
  $("#wg").onclick=e=>{e.preventDefault();W.file="CC_ENRICH/gaps.csv";web()};
  const grab=()=>{W.file=$("#wf").value.trim();W.par=+$("#wp").value||20;W.delay=+$("#wd").value||0;
    W.limit=+$("#wl").value||0;W.robots=$("#wr").checked;if($("#wpg"))W.pages=+$("#wpg").value;};
  $("#wst").onclick=async()=>{grab();const r=await post("/api/web/status",{});if(r.error)return toast(r.error,true);W.sum=r;web()};
  $("#wex").onclick=async()=>{const r=await post("/api/web/export",{});
    if(r.error)return toast(r.error,true);toast(nfmt(r.domains_with_an_address)+" domains -> "+r.file);W.out=r;web()};
  $("#wrun").onclick=async()=>{grab();

      ".\n\nThis contacts the websites themselves, from your connection, "+W.par+" at a time"+
      (W.robots?"":"\n\nrobots.txt will be IGNORED.")))return;
    const r=await post("/api/web/"+W.tab,{file:W.file,par:W.par,pages:W.pages,delay:W.delay,
      limit:W.limit,ignore_robots:!W.robots});
    if(r.error)return toast(r.error,true);curJob=r.job;JT="log";await refresh();go("log")};
  if(!W.sum){const r=await post("/api/web/status",{});if(!r.error){W.sum=r;const b=$(".sum");if(!b)web()}}
}

   ${(MB||[]).length?`<div class="tools" style="margin-bottom:14px">${(MB||[]).slice(0,MBN).map(b=>`<div class="tool">
     <div><h3>${esc(b.name)} <span class="tag">${esc(b.daily_limit)}/day</span></h3><p>${esc(b.from_name||"")} &lt;${esc(b.from_email||"")}&gt;</p>
     <div class="file">SMTP ${esc(b.smtp_host||"-")}:${esc(b.smtp_port)} ${b.has_smtp_pass?"(password saved)":"<b>(no password yet)</b>"}${b.imap_host?" &middot; IMAP "+esc(b.imap_host)+":"+esc(b.imap_port):""}${b.from_manyreach?" &middot; from Manyreach"+(b.manyreach_warmup?", warming up":""):""}</div></div>
     <div></div><div class="acts"><button class="btn" data-bedit="${esc(b.name)}">Edit</button><button class="btn" data-bdel="${esc(b.name)}">Remove</button></div></div>`).join("")}</div>
     ${(MB||[]).length>MBN?`<button class="btn" id="mbmore" style="margin-bottom:14px">Show ${esc(Math.min(25,(MB||[]).length-MBN))} more of ${esc((MB||[]).length)}</button>`:""}`:""}
   <div class="form">
    <label for="nbn">Name</label><div><input type="text" id="nbn" value="${esc(B.name||"")}" placeholder="Juraj - AMCEF" style="width:100%"><small>Whatever you want to call it. Saving under an existing name replaces that one.</small></div>
    <label for="nbf">From</label><div style="display:flex;gap:6px;flex-wrap:wrap"><input type="text" id="nbfn" value="${esc(B.from_name||"")}" placeholder="Juraj Brandobur" style="flex:1;min-width:140px"><input type="text" id="nbf" value="${esc(B.from_email||"")}" placeholder="juraj@example.com" style="flex:2;min-width:200px"></div>
    <label for="nbr">Reply-To</label><div><input type="text" id="nbr" value="${esc(B.reply_to||"")}" placeholder="optional" style="width:100%"></div>
    <label for="nbsh">SMTP</label><div style="display:flex;gap:6px;flex-wrap:wrap"><input type="text" id="nbsh" value="${esc(B.smtp_host||"")}" placeholder="smtp.gmail.com" style="flex:2;min-width:180px">
     <input type="number" id="nbsp" value="${esc(B.smtp_port||587)}" style="width:90px"><select id="nbse"><option value="starttls" ${B.smtp_security==="ssl"?"":"selected"}>starttls</option><option value="ssl" ${B.smtp_security==="ssl"?"selected":""}>ssl</option></select></div>
    <label for="nbsu">SMTP user</label><div><input type="text" id="nbsu" value="${esc(B.smtp_user||"")}" placeholder="usually the same as the From address" style="width:100%"></div>
    <label for="nbsw">SMTP password</label><div><input type="password" id="nbsw" placeholder="${B.has_smtp_pass?"Saved - paste a new one to replace it":"an app password"}" autocomplete="off" style="width:100%"></div>
    <label for="nbih">IMAP</label><div style="display:flex;gap:6px;flex-wrap:wrap"><input type="text" id="nbih" value="${esc(B.imap_host||"")}" placeholder="imap.gmail.com - optional, for reading replies" style="flex:2;min-width:180px">
     <input type="number" id="nbip" value="${esc(B.imap_port||993)}" style="width:90px"></div>
    <label for="nbiw">IMAP password</label><div><input type="password" id="nbiw" placeholder="${B.has_imap_pass?"Saved":"leave empty to reuse the SMTP password"}" autocomplete="off" style="width:100%"></div>
    <label for="nbd">Daily cap</label><div><input type="number" id="nbd" value="${esc(B.daily_limit||40)}" min="1" style="width:110px"><small>Emails a day from this mailbox. Start at 20-30 on a new one and raise it over weeks.</small></div>
    <label for="nbu">Unsubscribe to</label><div><input type="text" id="nbu" value="${esc(B.unsubscribe_mailto||"")}" placeholder="optional - an address for the one-click unsubscribe header" style="width:100%"></div>
    <div class="full" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn go" id="nbs">Save mailbox</button>${B.name?`<button class="btn" id="nbc">Cancel</button>`:""}<button class="btn" data-v="outreach">Test it on the Outreach page</button></div>
   </div></section>
  <section class="box"><h2>Outreach channels</h2>
   <p>Three separate programs you install and run yourself; Lead Studio only talks to them. OpenWA is a WhatsApp gateway, Postiz schedules social posts, Agent Reach reads threads. Keys are kept in lead_studio_settings.json on this computer.</p>
   <div class="form">
    <label for="wu">OpenWA address</label><div><input type="text" id="wu" value="${esc(st.wa_url||"")}" style="width:100%"><small>Its default is http://localhost:2785 once OpenWA is running.</small></div>
    <label for="wk">OpenWA API key</label><div><input type="password" id="wk" placeholder="${st.wa_has_key?"Saved - paste a new one to replace it":"Only if you set one in OpenWA"}" autocomplete="off" style="width:100%"></div>
    <label for="wss">OpenWA session</label><div><input type="text" id="wss" value="${esc(st.wa_session||"default")}" style="width:240px"></div>
    <label for="pu">Postiz address</label><div><input type="text" id="pu" value="${esc(st.postiz_url||"")}" style="width:100%"><small>https://api.postiz.com for the hosted one, or your own server if you self-host it.</small></div>
    <label for="pk">Postiz API key</label><div><input type="password" id="pk" placeholder="${st.postiz_has_key?"Saved - paste a new one to replace it":"Postiz, Settings, Public API"}" autocomplete="off" style="width:100%"></div>
    <label for="rcm">Agent Reach command</label><div><input type="text" id="rcm" value="${esc(st.reach_cmd||"agent-reach")}" style="width:240px"></div>
    <div class="full" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn go" id="cs">Save</button><button class="btn" data-v="outreach">Test them on the Outreach page</button></div>
   </div></section>
  <section class="box"><h2>Workspace</h2><p>Lead Studio works inside this folder and runs the tools with the Python installed on this computer.</p>
   <pre class="code">${esc(S.root||"")}</pre><button class="btn" id="wo">Open in Explorer</button> <button class="btn" id="wr">Rescan scripts</button>
   <div class="form" style="margin-top:14px"><label for="ccd">Common Crawl folder</label>
    <div><input type="text" id="ccd" value="${esc(st.cc_dir||"")}" placeholder="found automatically - the folder holding cc_bulk_scrape.py and cc_pages" style="width:100%">
     <small>Used by "No contacts" to look domains up in the crawl. Leave it empty unless the folder moved.</small></div>
    <div class="full"><button class="btn" id="ccs">Save</button></div></div></section></div>`;
  const save=async extra=>{const b={ollama_base:$("#ob").value,ollama_model:$("#om").value,...extra};if($("#ok").value.trim())b.ollama_key=$("#ok").value.trim();
    const r=await post("/api/settings",b);if(r.error){toast(r.error,true);return false}S.settings=r.settings;chrome();return true};
  $("#os").onclick=async()=>{if(await save()){toast("Saved");conn()}};
  $("#ot").onclick=async()=>{if(!await save())return;$("#omsg").textContent="Asking Ollama";const r=await get("/api/ollama/models");
    if(r.error){models=[];return conn(r.error)}models=r.models;if(!S.settings.ollama_model&&models.length){await post("/api/settings",{ollama_model:models[0]});await refresh()}conn("Connected. "+models.length+" models available to this key.")};
  if($("#of"))$("#of").onclick=async()=>{await save({forget_key:true});models=null;toast("Key removed");conn()};
  $("#mt").onclick=async()=>{await save({new_mcp_token:true});toast("New token made. Update it in your client.");conn()};
  const saveA=async()=>{const b={agentsdr_url:$("#au").value};if($("#ak").value.trim())b.agentsdr_key=$("#ak").value.trim();
    const r=await post("/api/channel/settings",b);if(r.error){toast(r.error,true);return false}S.settings=r.settings;chrome();return true};
  $("#as").onclick=async()=>{if(await saveA()){toast("Saved");conn()}};
  $("#at").onclick=async()=>{if(!await saveA())return;$("#amsg").textContent="Asking AgentSDR";
    const r=await post("/api/agentsdr",{action:"campaigns"});$("#amsg").textContent=r.ok?("Connected. "+r.count+" email campaigns."):(r.error||"No answer")};
  $("#cs").onclick=async()=>{const b={wa_url:$("#wu").value,wa_session:$("#wss").value,postiz_url:$("#pu").value,reach_cmd:$("#rcm").value};
    if($("#wk").value.trim())b.wa_key=$("#wk").value.trim();if($("#pk").value.trim())b.postiz_key=$("#pk").value.trim();
    const r=await post("/api/channel/settings",b);if(r.error)return toast(r.error,true);S.settings=r.settings;chrome();toast("Saved");conn()};
  if($("#mrs"))$("#mrs").onclick=async()=>{const b={mr_base:$("#mru").value};if($("#mrk").value.trim())b.mr_key=$("#mrk").value.trim();
    const r=await post("/api/channel/settings",b);if(r.error)return toast(r.error,true);S.settings=r.settings;chrome();toast("Saved");conn()};
  if($("#mrt"))$("#mrt").onclick=async()=>{const b={mr_base:$("#mru").value};if($("#mrk").value.trim())b.mr_key=$("#mrk").value.trim();
    await post("/api/channel/settings",b);await refresh();$("#mrmsg").textContent="Asking Manyreach";
    const r=await post("/api/channel",{cmd:"mr-check"});
    $("#mrmsg").textContent=r.ok?("Connected. "+r.campaigns+" campaigns, "+r.senders+" senders."):((r.detail&&r.detail.error)||r.error||"No answer")};
  if($("#mbimp"))$("#mbimp").onclick=async()=>{
    if(!S.settings.mr_has_key)return toast("Save the Manyreach API key first",true);
    if(!confirm("Copy the senders from Manyreach into Lead Studio?\n\nServer, port, username, daily limit and "
      +"warmup state come across. Manyreach never gives out the passwords, so each mailbox arrives without one "
      +"and cannot send until you add it. Passwords already saved here are kept."))return;
    toast("Asking Manyreach - this pages through the whole account, give it a moment");
    const r=await post("/api/mailbox/import",{only_connected:$("#mbonly").checked});
    if(r.error)return toast(r.error,true);
    S.settings=r.settings;await boxes(true);
    toast(r.added+" added, "+r.updated+" updated, "+r.need_a_password+" still need a password");conn()};
  if($("#mbmore"))$("#mbmore").onclick=()=>{MBN+=25;conn()};
  $$("[data-bedit]").forEach(x=>x.onclick=()=>{B=(MB||[]).find(m=>m.name===x.dataset.bedit)||{};conn()});
  $$("[data-bdel]").forEach(x=>x.onclick=async()=>{if(!confirm("Remove the mailbox \""+x.dataset.bdel+"\"? Nothing already sent is touched."))return;
    const r=await post("/api/mailbox",{action:"delete",name:x.dataset.bdel});if(r.error)return toast(r.error,true);
    S.settings=r.settings;await boxes(true);B={};toast("Removed");conn()});
  if($("#nbc"))$("#nbc").onclick=()=>{B={};conn()};
  if($("#nbs"))$("#nbs").onclick=async()=>{const box={name:$("#nbn").value,from_name:$("#nbfn").value,from_email:$("#nbf").value,
      reply_to:$("#nbr").value,smtp_host:$("#nbsh").value,smtp_port:$("#nbsp").value,smtp_security:$("#nbse").value,
      smtp_user:$("#nbsu").value||$("#nbf").value,imap_host:$("#nbih").value,imap_port:$("#nbip").value,
      daily_limit:$("#nbd").value,unsubscribe_mailto:$("#nbu").value};
    if($("#nbsw").value)box.smtp_pass=$("#nbsw").value;
    if($("#nbiw").value)box.imap_pass=$("#nbiw").value;
    if($("#nbih").value&&!box.imap_user)box.imap_user=$("#nbsu").value||$("#nbf").value;
    const r=await post("/api/mailbox",{box});if(r.error)return toast(r.error,true);
    S.settings=r.settings;await boxes(true);B={};chrome();toast("Mailbox saved");conn()};
  if($("#ccs"))$("#ccs").onclick=async()=>{const r=await post("/api/channel/settings",{cc_dir:$("#ccd").value});
    if(r.error)return toast(r.error,true);S.settings=r.settings;toast("Saved");conn()};
  $("#wo").onclick=()=>post("/api/open",{path:"."});$("#wr").onclick=async()=>{await post("/api/reload");await refresh();toast("Script list refreshed")};
  $$("[data-copy]").forEach(b=>b.onclick=()=>navigator.clipboard.writeText($("#"+b.dataset.copy).textContent).then(()=>toast("Copied")));
  if(view==="senders"){$("#main .bar h1").textContent="Senders";
    $$("#main section.box").forEach(x=>{if(!/mailboxes \(SMTP/.test(x.querySelector("h2")?.textContent||""))x.style.display="none"})}
}

if(view.startsWith("leads:")){L.file=view.slice(6);L.path=L.file.split("/").slice(0,-1).join("/");view="leads"}
if(view.startsWith("enrich:")){E.input=view.slice(7);view="enrich"}
if(view==="search")view="contacts";
addEventListener("hashchange",()=>{const v=decodeURIComponent(location.hash.slice(1))||"today";if(v!==view&&v!=="log"){view=v;clearInterval(timer);chrome();render()}});
refresh().then(render);setInterval(refresh,4000);
</script>
</body>
</html>
